# Light theme for Stale-Answer Detector (Clean, modern, premium SaaS look)
[theme]
base = "light"
primaryColor = "#5B5BF0"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#5B5BF0"
borderColor = "#E5E7EF"
codeTextColor = "#0F172A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
paddingTop = "1.5rem"
paddingBottom = "2.5rem"

greenColor = "#16A34A"
yellowColor = "#D97706"
redColor = "#DC2626"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E5E7EF"
primaryColor = "#5B5BF0"
linkColor = "#5B5BF0"
