# Dark theme for Stale-Answer Detector (Cosmic Glassmorphism)
[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
linkColor = "#818CF8"
borderColor = "rgba(148, 163, 184, 0.2)"
codeTextColor = "#F8FAFC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
paddingTop = "1.5rem"
paddingBottom = "2.5rem"

greenColor = "#10B981"
yellowColor = "#F59E0B"
redColor = "#EF4444"

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
borderColor = "rgba(148, 163, 184, 0.2)"
primaryColor = "#6366F1"
linkColor = "#818CF8"

[server]
enableStaticServing = true
