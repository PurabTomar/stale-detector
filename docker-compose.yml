services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stale-detector:local
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); assert r.status == 200 and r.read().strip() == b'ok'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional FastAPI Guard & Verification API service:
  #   docker compose --profile api up --build
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    image: stale-detector:local
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Maxim AI Bifrost Gateway profile:
  #   docker compose --profile bifrost up --build
  bifrost:
    profiles: ["bifrost"]
    image: maximhq/bifrost:latest
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - LOG_LEVEL=info
      - LOG_STYLE=json
    volumes:
      - ./deploy/bifrost/config.json:/app/data/config.json:ro
    restart: unless-stopped
