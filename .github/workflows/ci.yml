name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn

      - name: Verify core module imports
        env:
          CI: "true"
        run: |
          python -c "import extractor, verifier, llm, reporting, benchmark, demo_data, api, app; print('All modules imported cleanly.')"

      - name: Run unit tests (all network calls mocked, no secrets required)
        env:
          CI: "true"
          LLM_API_KEY: "mock-ci-key"
          GEMINI_API_KEY: "mock-ci-key"
          TAVILY_API_KEY: "tvly-mock-ci-key"
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
